name: Build wheels

on:
  push:
    branches:
      - main
      - build-test
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out mxslc
        uses: actions/checkout@v4

      - name: Set up Python for cibuildwheel
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Check out MaterialX
        uses: actions/checkout@v4
        with:
          repository: AcademySoftwareFoundation/MaterialX
          ref: v1.39.4
          path: mxslc++/external/MaterialX

      - name: Build wheels on Linux
        if: runner.os == 'Linux'
        working-directory: mxslc++
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BEFORE_ALL_LINUX: >
            cmake
            -S /project/external/MaterialX
            -B /project/external/MaterialX/build
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX=/project/external/MaterialX/install
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            -DMATERIALX_BUILD_PYTHON=OFF
            -DMATERIALX_BUILD_VIEWER=OFF
            -DMATERIALX_BUILD_GRAPH_EDITOR=OFF
            -DMATERIALX_BUILD_DOCS=OFF
            -DMATERIALX_BUILD_GEN_GLSL=OFF
            -DMATERIALX_BUILD_GEN_OSL=OFF
            -DMATERIALX_BUILD_GEN_MDL=OFF
            -DMATERIALX_BUILD_GEN_MSL=OFF
            -DMATERIALX_BUILD_GEN_SLANG=OFF
            -DMATERIALX_BUILD_RENDER=OFF
            -DMATERIALX_BUILD_RENDER_PLATFORMS=OFF
            -DMATERIALX_BUILD_OIIO=OFF
            -DMATERIALX_BUILD_OCIO=OFF
            -DMATERIALX_BUILD_TESTS=OFF
            -DMATERIALX_BUILD_BENCHMARK_TESTS=OFF
            -DMATERIALX_BUILD_OSOS=OFF
            -DMATERIALX_BUILD_PERFETTO_TRACING=OFF
            -DMATERIALX_BUILD_SHARED_LIBS=OFF
            -DMATERIALX_BUILD_DATA_LIBRARY=OFF
            -DMATERIALX_BUILD_MONOLITHIC=OFF
            -DMATERIALX_BUILD_USE_CCACHE=OFF
            -DMATERIALX_PYTHON_LTO=OFF
            -DMATERIALX_INSTALL_PYTHON=OFF
            -DMATERIALX_INSTALL_RESOURCES=OFF
            -DMATERIALX_TEST_RENDER=OFF
            -DMATERIALX_TEST_RENDER_GLSL=OFF
            -DMATERIALX_TEST_REFERENCE_QUALITY=OFF
            -DMATERIALX_WARNINGS_AS_ERRORS=OFF
            -DMATERIALX_COVERAGE_ANALYSIS=OFF
            -DMATERIALX_DYNAMIC_ANALYSIS=OFF
            &&
            cmake --build /project/external/MaterialX/build --config Release --target install --parallel

          CIBW_ENVIRONMENT_LINUX: >
            CMAKE_ARGS="-DMTLX_ROOT=/project/external/MaterialX/install -DBUILD_TESTING=OFF"

      - name: Configure MaterialX on Windows
        if: runner.os == 'Windows'
        run: >
          cmake
          -S mxslc++/external/MaterialX
          -B mxslc++/external/MaterialX/build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/mxslc++/external/MaterialX/install"
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          -DMATERIALX_BUILD_PYTHON=OFF
          -DMATERIALX_BUILD_VIEWER=OFF
          -DMATERIALX_BUILD_GRAPH_EDITOR=OFF
          -DMATERIALX_BUILD_DOCS=OFF
          -DMATERIALX_BUILD_GEN_GLSL=OFF
          -DMATERIALX_BUILD_GEN_OSL=OFF
          -DMATERIALX_BUILD_GEN_MDL=OFF
          -DMATERIALX_BUILD_GEN_MSL=OFF
          -DMATERIALX_BUILD_GEN_SLANG=OFF
          -DMATERIALX_BUILD_RENDER=OFF
          -DMATERIALX_BUILD_RENDER_PLATFORMS=OFF
          -DMATERIALX_BUILD_OIIO=OFF
          -DMATERIALX_BUILD_OCIO=OFF
          -DMATERIALX_BUILD_TESTS=OFF
          -DMATERIALX_BUILD_BENCHMARK_TESTS=OFF
          -DMATERIALX_BUILD_OSOS=OFF
          -DMATERIALX_BUILD_PERFETTO_TRACING=OFF
          -DMATERIALX_BUILD_SHARED_LIBS=OFF
          -DMATERIALX_BUILD_DATA_LIBRARY=OFF
          -DMATERIALX_BUILD_MONOLITHIC=OFF
          -DMATERIALX_BUILD_USE_CCACHE=OFF
          -DMATERIALX_PYTHON_LTO=OFF
          -DMATERIALX_INSTALL_PYTHON=OFF
          -DMATERIALX_INSTALL_RESOURCES=OFF
          -DMATERIALX_TEST_RENDER=OFF
          -DMATERIALX_TEST_RENDER_GLSL=OFF
          -DMATERIALX_TEST_REFERENCE_QUALITY=OFF
          -DMATERIALX_WARNINGS_AS_ERRORS=OFF
          -DMATERIALX_COVERAGE_ANALYSIS=OFF
          -DMATERIALX_DYNAMIC_ANALYSIS=OFF

      - name: Build and install MaterialX on Windows
        if: runner.os == 'Windows'
        run: cmake --build mxslc++/external/MaterialX/build --config Release --target install --parallel

      - name: Inspect MaterialX install on Windows
        if: runner.os == 'Windows'
        run: |
          Write-Host "MaterialX install tree:"
          Get-ChildItem -Recurse "${{ github.workspace }}/mxslc++/external/MaterialX/install" | Select-Object FullName

      - name: Build wheels on Windows
        if: runner.os == 'Windows'
        working-directory: mxslc++
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ENVIRONMENT_WINDOWS: >
            CMAKE_ARGS="-DMTLX_ROOT=${{ github.workspace }}/mxslc++/external/MaterialX/install -DBUILD_TESTING=OFF"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: mxslc++/wheelhouse/*.whl