<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXSL &#x2194; MTLX Converter</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CodeMirror 6 (via CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/theme/dracula.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/theme/monokai.min.css" rel="stylesheet">

    <style>
        :root {
            --editor-height: 55vh;
            --header-bg: #1e1e2e;
            --border-color: #313244;
        }

        body {
            background: #11111b;
            color: #cdd6f4;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .app-header {
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
        }

        .app-header h1 {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            margin: 0;
        }

        .app-header .badge {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            padding: 0.25em 0.7em;
            vertical-align: middle;
        }

        .editor-panel {
            background: #1e1e2e;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .editor-panel .panel-header {
            background: #181825;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .editor-panel .panel-header .icon {
            font-size: 1.1rem;
        }

        .editor-panel .panel-body {
            flex: 1;
            position: relative;
        }

        .editor-panel .panel-body .CodeMirror {
            height: var(--editor-height);
            border-radius: 0;
            font-size: 0.85rem;
            line-height: 1.55;
        }

        .editor-panel .panel-footer {
            background: #181825;
            padding: 0.65rem 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .center-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #6c7086;
            height: 100%;
            padding: 1rem 0;
        }

        .center-arrow .bi {
            transition: transform 0.3s ease;
        }

        .center-arrow .bi:hover {
            transform: scale(1.15);
            color: #89b4fa;
        }

        .btn-convert-mtlx {
            --bs-btn-color: #a6e3a1;
            --bs-btn-border-color: #a6e3a1;
            --bs-btn-hover-color: #11111b;
            --bs-btn-hover-bg: #a6e3a1;
            --bs-btn-hover-border-color: #a6e3a1;
            --bs-btn-active-color: #11111b;
            --bs-btn-active-bg: #a6e3a1;
        }

        .btn-convert-mxsl {
            --bs-btn-color: #89b4fa;
            --bs-btn-border-color: #89b4fa;
            --bs-btn-hover-color: #11111b;
            --bs-btn-hover-bg: #89b4fa;
            --bs-btn-hover-border-color: #89b4fa;
            --bs-btn-active-color: #11111b;
            --bs-btn-active-bg: #89b4fa;
        }

        .btn-load {
            --bs-btn-color: #cdd6f4;
            --bs-btn-border-color: #585b70;
            --bs-btn-hover-color: #cdd6f4;
            --bs-btn-hover-bg: #313244;
            --bs-btn-hover-border-color: #585b70;
        }

        .status-bar {
            background: #181825;
            border-top: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            color: #6c7086;
        }

        .status-bar .spinner-border {
            width: 0.9rem;
            height: 0.9rem;
            margin-right: 0.4rem;
        }

        .log-panel {
            background: #1e1e2e;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            overflow: hidden;
        }

        .log-panel .panel-header {
            background: #181825;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .log-panel textarea {
            background: #11111b;
            color: #a6adc8;
            border: none;
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            resize: vertical;
            min-height: 80px;
            max-height: 200px;
            outline: none;
        }

        .log-panel textarea:focus {
            box-shadow: inset 0 0 0 1px #89b4fa;
        }

        @media (max-width: 991.98px) {
            .center-arrow {
                padding: 0.5rem 0;
                font-size: 2rem;
            }
            :root {
                --editor-height: 35vh;
            }
        }
    </style>
</head>
<body>

    <!-- ── Header ──────────────────────────────────────────────── -->
    <header class="app-header">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <h1>
                    <i class="bi bi-arrow-left-right me-2" style="color:#89b4fa;"></i>
                    MXSL <span class="text-white-50">&#x2194;</span> MTLX
                    <span class="badge bg-secondary ms-2">Converter</span>
                </h1>
                <div>
                    <span class="text-white-50 small me-2">powered by</span>
                    <strong>ShadingLanguageX</strong>
                </div>
            </div>
        </div>
    </header>

    <!-- ── Main ────────────────────────────────────────────────── -->
    <main class="container-fluid py-2">
        <div class="row">

            <!-- Left: MTLX -->
            <div class="col-6">
                <div class="editor-panel" id="panel-mtlx">
                    <div class="panel-header">
                        <span class="icon"><i class="bi bi-filetype-xml"></i></span>
                        <span>MaterialX (MTLX)</span>
                        <span class="badge bg-success ms-auto">XML</span>
                    </div>
                    <div class="panel-body">
                        <textarea id="editor-mtlx" placeholder="Paste MTLX XML here, or load a file..."></textarea>
                    </div>
                    <div class="panel-footer">
                        <button class="btn btn-sm btn-load" onclick="loadFile('mtlx')">
                            <i class="bi bi-folder2-open me-1"></i> Load File
                        </button>
                        <button class="btn btn-sm btn-convert-mtlx ms-auto" onclick="convertMtlxToMxsl()">
                            <i class="bi bi-arrow-right-short me-1"></i> To MXSL
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: MXSL -->
            <div class="col-6">
                <div class="editor-panel" id="panel-mxsl">
                    <div class="panel-header">
                        <span class="icon"><i class="bi bi-filetype-js"></i></span>
                        <span>MXSL Shading Language</span>
                        <span class="badge bg-info ms-auto">MXSL</span>
                    </div>
                    <div class="panel-body">
                        <textarea id="editor-mxsl" placeholder="Paste MXSL code here, or load a file..."></textarea>
                    </div>
                    <div class="panel-footer">
                        <button class="btn btn-sm btn-load" onclick="loadFile('mxsl')">
                            <i class="bi bi-folder2-open me-1"></i> Load File
                        </button>
                        <button class="btn btn-sm btn-convert-mxsl ms-auto" onclick="convertMxslToMtlx()">
                            To MTLX <i class="bi bi-arrow-left-short me-0 ms-1"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- ── Log / Message Area ──────────────────────────────────── -->
    <div class="container-fluid pb-4">
        <div class="log-panel">
            <div class="panel-header">
                <span><i class="bi bi-terminal me-1" style="color:#89b4fa;"></i></span>
                <span>Log</span>
                <button class="btn btn-sm btn-link text-white-50 ms-auto p-0" onclick="clearLog()" title="Clear log">
                    <i class="bi bi-trash3"></i>
                </button>
            </div>
            <textarea id="message-log" placeholder=""></textarea>
        </div>
    </div>

    <!-- ── Hidden file input ───────────────────────────────────── -->
    <input type="file" id="file-input" accept=".mtlx,.mxsl,.xml,.txt" style="display:none;">

    <!-- ── Scripts ─────────────────────────────────────────────── -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/xml/xml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/clike/clike.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/selection/active-line.min.js"></script>

    <script>
        // ============================================================
        //  MXSL custom CodeMirror mode — built from API keywords
        // ============================================================

        /** Register a custom MXSL mode with given keywords and builtins. */
        function registerMxslMode(keywords, builtins) {
            // Categorize keywords
            const dataTypes = new Set([
                'boolean','integer','float','string','filename',
                'vector2','vector3','vector4','color3','color4',
                'matrix33','matrix44',
                'surfaceshader','displacementshader','volumeshader','lightshader',
                'material','BSDF','EDF','VDF',
                'integerarray','floatarray','stringarray',
                'vector2array','vector3array','vector4array',
                'color3array','color4array','T',
                'bool','int','vec2','vec3','vec4'
            ]);
            const control = new Set(['if','else','switch','for','return',
                'true','false','and','or','not','null',
                'auto','out','global','inline','const',
                'uniform','varying','namespace','void']);

            CodeMirror.defineMode('mxsl', function() {
                return {
                    startState: function() { return { inComment: false }; },
                    token: function(stream, state) {
                        // Multi-line comments
                        if (state.inComment) {
                            const m = stream.match(/.*?\*\//);
                            if (m) { state.inComment = false; return 'comment'; }
                            stream.skipToEnd();
                            return 'comment';
                        }
                        // Skip whitespace
                        if (stream.eatSpace()) return null;

                        // Single-line comment
                        if (stream.match(/\/\/.*/)) return 'comment';

                        // Multi-line comment start
                        if (stream.match(/\/\*/)) { state.inComment = true; return 'comment'; }

                        // String literals
                        if (stream.match(/"(?:[^"\\]|\\.)*"/)) return 'string';
                        if (stream.match(/'(?:[^'\\]|\\.)*'/)) return 'string';

                        // Numbers
                        if (stream.match(/\b\d+\.?\d*(?:[eE][+-]?\d+)?\b/)) return 'number';

                        // Preprocessor / directives
                        if (stream.match(/#\w+/)) return 'meta';

                        // Operators
                        if (stream.match(/[+\-*/%=<>!&|^~]+/)) return 'operator';

                        // Identifiers and keywords
                        if (stream.match(/[a-zA-Z_$][\w$]*/)) {
                            const word = stream.current();
                            if (dataTypes.has(word)) return 'type';
                            if (control.has(word)) return 'keyword';
                            if (builtins && builtins.includes(word)) return 'builtin';
                            if (word === word.toUpperCase() && word.length >= 2) return 'atom';
                            return 'variable';
                        }

                        // Braces and punctuation
                        if (stream.match(/[{}()\[\];,.]/)) return null;

                        stream.next();
                        return null;
                    }
                };
            });
        }

        // ============================================================
        //  CodeMirror initialisation (after keywords are fetched)
        // ============================================================

        const sharedOptions = {
            lineNumbers: true,
            matchBrackets: true,
            styleActiveLine: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            lineWrapping: false,
            autofocus: false,
            extraKeys: {
                'Ctrl-S': function(cm) { cm.save(); },
                'Cmd-S': function(cm) { cm.save(); }
            }
        };

        let editorMtlx, editorMxsl;

        // Fetch keywords from backend, register MXSL mode, then init editors
        fetch('/api/keywords')
            .then(r => r.json())
            .then(data => {
                registerMxslMode(data.keywords || [], data.builtins || []);
                logMessage('Loaded ' + (data.keywords || []).length + ' keywords and ' +
                    (data.builtins || []).length + ' builtins', 'success');

                // MTLX editor – XML mode
                editorMtlx = CodeMirror.fromTextArea(
                    document.getElementById('editor-mtlx'),
                    Object.assign({}, sharedOptions, {
                        theme: 'dracula',
                        mode: 'xml',
                        placeholder: 'Paste MTLX XML here, or load a file...'
                    })
                );

                // MXSL editor – custom mxsl mode with real keywords
                editorMxsl = CodeMirror.fromTextArea(
                    document.getElementById('editor-mxsl'),
                    Object.assign({}, sharedOptions, {
                        theme: 'monokai',
                        mode: 'mxsl',
                        placeholder: 'Paste MXSL code here, or load a file...'
                    })
                );

                editorMtlx.refresh();
                editorMxsl.refresh();
            })
            .catch(err => {
                logMessage('Failed to load keywords: ' + err.message, 'error');
                // Fallback: init editors with clike mode
                editorMtlx = CodeMirror.fromTextArea(
                    document.getElementById('editor-mtlx'),
                    Object.assign({}, sharedOptions, {
                        theme: 'darcula',
                        mode: 'xml',
                        placeholder: 'Paste MTLX XML here, or load a file...'
                    })
                );
                editorMxsl = CodeMirror.fromTextArea(
                    document.getElementById('editor-mxsl'),
                    Object.assign({}, sharedOptions, {
                        theme: 'monokai',
                        mode: 'text/x-csrc',
                        placeholder: 'Paste MXSL code here, or load a file...'
                    })
                );
            });

        // ============================================================
        //  Status helpers
        // ============================================================

        function logMessage(message, type) {
            const el = document.getElementById('message-log');
            const timestamp = new Date().toLocaleTimeString();
            const icons = {
                error: '[\u2716]',
                success: '[\u2714]',
                info: '[\u2139]'
            };
            const icon = icons[type] || '[\u2139]';
            const text = `[${timestamp}] ${icon} ${message}\n`;
            el.value += text;
            el.scrollTop = el.scrollHeight;
        }

        function clearLog() {
            const el = document.getElementById('message-log');
            el.value = '';
        }

        // ============================================================
        //  Load file
        // ============================================================

        let pendingTarget = null;

        function loadFile(target) {
            pendingTarget = target;
            const input = document.getElementById('file-input');
            input.accept = '.mtlx,.mxsl,.xml,.txt';
            input.value = '';
            input.click();
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !pendingTarget) return;

            logMessage('Loading ' + file.name + '…', 'info');
            const reader = new FileReader();
            reader.onload = function(ev) {
                const content = ev.target.result;
                if (pendingTarget === 'mtlx') {
                    editorMtlx.setValue(content);
                    logMessage('Loaded ' + file.name + ' into MTLX editor', 'success');
                } else {
                    editorMxsl.setValue(content);
                    logMessage('Loaded ' + file.name + ' into MXSL editor', 'success');
                }
                pendingTarget = null;
            };
            reader.onerror = function() {
                logMessage('Failed to read file', 'error');
                pendingTarget = null;
            };
            reader.readAsText(file);
        });

        // ============================================================
        //  Convert: MTLX → MXSL (decompile)
        // ============================================================

        async function convertMtlxToMxsl() {
            const source = editorMtlx.getValue().trim();
            if (!source) {
                logMessage('MTLX editor is empty', 'error');
                return;
            }

            logMessage('Decompiling MTLX → MXSL…', 'info');
            try {
                const resp = await fetch('/api/decompile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source })
                });
                const data = await resp.json();
                if (data.error) {
                    logMessage('Decompile error: ' + data.error, 'error');
                    return;
                }
                editorMxsl.setValue(data.result);
                logMessage('MTLX decompiled to MXSL (' + data.result.length + ' chars)', 'success');
            } catch (err) {
                logMessage('Network error: ' + err.message, 'error');
            }
        }

        // ============================================================
        //  Convert: MXSL → MTLX (compile)
        // ============================================================

        async function convertMxslToMtlx() {
            const source = editorMxsl.getValue().trim();
            if (!source) {
                logMessage('MXSL editor is empty', 'error');
                return;
            }

            logMessage('Compiling MXSL → MTLX…', 'info');
            try {
                const resp = await fetch('/api/compile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source })
                });
                const data = await resp.json();
                if (data.error) {
                    logMessage('Compile error: ' + data.error, 'error');
                    return;
                }
                editorMtlx.setValue(data.result);
                logMessage('MXSL compiled to MTLX (' + data.result.length + ' chars)', 'success');
            } catch (err) {
                logMessage('Network error: ' + err.message, 'error');
            }
        }
    </script>

</body>
</html>
