<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXSL &#x2194; MTLX Converter</title>

    <script>
        // Detect OS color scheme preference before page renders
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-bs-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-bs-theme', 'light');
        }
        // Listen for changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light');
        });
    </script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CodeMirror 5 (via CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/theme/dracula.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/theme/monokai.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/theme/darcula.min.css" rel="stylesheet">

    <style>
        :root { --editor-height: 55vh; }
        @media (max-width: 767.98px) { :root { --editor-height: 40vh; } }

        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: .7rem; }
        .CodeMirror { height: var(--editor-height) !important; font-size: .65rem; }
        .CodeMirror .cm-function { color: #0699ed; }

        .log-area {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: .65rem; line-height: 1.5;
            resize: vertical; min-height: 80px; max-height: 200px;
            outline: none;
        }
        .log-area:focus { box-shadow: inset 0 0 0 1px #89b4fa; }

        .btn-convert-mtlx { --bs-btn-color: #a6e3a1; --bs-btn-border-color: #a6e3a1;
            --bs-btn-hover-color: #000; --bs-btn-hover-bg: #a6e3a1; }
        .btn-convert-mxsl { --bs-btn-color: #89b4fa; --bs-btn-border-color: #89b4fa;
            --bs-btn-hover-color: #000; --bs-btn-hover-bg: #89b4fa; }
        .btn-load { --bs-btn-color: #6c757d; --bs-btn-border-color: #6c757d;
            --bs-btn-hover-color: #fff; --bs-btn-hover-bg: #6c757d; }

        .server-status {
            font-size: .75rem; cursor: pointer; user-select: none;
        }
    </style>
</head>
<body class="min-vh-100">

    <!-- ── Header ──────────────────────────────────────────────── -->
    <header class="border-bottom py-3">
        <div class="container d-flex align-items-center justify-content-between">
            <h1 class="fs-5 fw-bold m-0">
                <i class="bi bi-arrow-left-right me-2" style="color:#89b4fa;"></i>
                MXSL <span class="text-body-secondary">&#x2194;</span> MTLX Converter
                <!-- <span class="badge ms-2 align-middle" style="font-size:.65rem;">Converter</span> -->
            </h1>
            <div>
                <span class="text-body-secondary small me-2">powered by</span>
                <strong>ShadingLanguageX</strong>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="container-fluid py-3">
        <div class="row g-3">

            <!-- Left: MTLX -->
            <div class="col-md-6 d-flex">
                <div class="border rounded-3 overflow-hidden w-100 d-flex flex-column">
                    <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2 fw-semibold small text-uppercase">
                        <i class="bi bi-filetype-xml"></i>
                        <span>MaterialX (MTLX)</span>
                        <span class="badge bg-success ms-auto">XML</span>
                    </div>
                    <div class="flex-fill position-relative">
                        <textarea id="editor-mtlx" placeholder="Paste MTLX XML here, or load a file..."></textarea>
                    </div>
                    <div class="px-3 py-2 border-top d-flex gap-2 flex-wrap">
                        <button class="btn btn-sm btn-load" onclick="loadFile('mtlx')">
                            <i class="bi bi-folder2-open me-1"></i> Load File
                        </button>
                        <button class="btn btn-sm btn-convert-mtlx ms-auto" onclick="convertMtlxToMxsl()">
                            <i class="bi bi-arrow-right-short me-1"></i> To MXSL
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: MXSL -->
            <div class="col-md-6 d-flex">
                <div class="border rounded-3 overflow-hidden w-100 d-flex flex-column">
                    <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2 fw-semibold small text-uppercase">
                        <i class="bi bi-file-earmark-code"></i>
                        <span>MXSL Shading Language</span>
                        <span class="badge bg-primary ms-auto">MXSL</span>
                    </div>
                    <div class="flex-fill position-relative">
                        <textarea id="editor-mxsl" placeholder="Paste MXSL code here, or load a file..."></textarea>
                    </div>
                    <div class="px-3 py-2 border-top d-flex gap-2 flex-wrap">
                        <button class="btn btn-sm btn-load" onclick="loadFile('mxsl')">
                            <i class="bi bi-folder2-open me-1"></i> Load File
                        </button>
                        <button class="btn btn-sm btn-convert-mxsl ms-auto" onclick="convertMxslToMtlx()">
                            To MTLX <i class="bi bi-arrow-left-short me-0 ms-1"></i>
                        </button>
                    </div>
                    <!-- Compile Options (MXSL → MTLX) -->
                    <div class="border-top">
                        <div class="px-3 py-1 d-flex align-items-center gap-2 small cursor-pointer" onclick="toggleOptions()" style="cursor:pointer; user-select:none;">
                            <i class="bi bi-gear" style="color:#89b4fa; font-size:.75rem;"></i>
                            <span class="text-body-secondary">Compile Options</span>
                            <span class="ms-auto text-body-secondary" id="options-toggle-label" style="font-size:.7rem;">show</span>
                        </div>
                        <div class="px-3 py-2 d-none border-top" id="options-body">
                            <div class="d-flex flex-wrap gap-3 align-items-end">
                                <div id="version_select">
                                    <label class="form-label small mb-0">MTLX Version</label>
                                    <select class="form-select form-select-sm" id="opt-version" style="width:auto;">
                                        <option value="1.39.5" selected>1.39.5</option>
                                        <option value="1.39.4">1.39.4</option>
                                    </select>
                                </div>
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" id="opt-reduce-graph" checked>
                                    <label class="form-check-label small" for="opt-reduce-graph">Reduce graph</label>
                                </div>
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" id="opt-error-missing" checked>
                                    <label class="form-check-label small" for="opt-error-missing">Error on missing globals</label>
                                </div>
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" id="opt-error-unused" checked>
                                    <label class="form-check-label small" for="opt-error-unused">Error on unused globals</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Log / Message Area -->
    <div class="container-fluid pb-4">
        <div class="border rounded-3 overflow-hidden">
            <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2 fw-semibold small text-uppercase">
                <i class="bi bi-terminal me-1" style="color:#89b4fa;"></i>
                <span>Log</span>
                <span id="server-status" class="server-status text-body-secondary">
                    <i class="bi bi-cpu me-1"></i>Server loading...
                </span>
                <button class="btn btn-sm btn-link text-body-secondary ms-auto p-0" onclick="clearLog()" title="Clear log">
                    <i class="bi bi-trash3"></i>
                </button>
            </div>
            <textarea id="message-log" class="log-area w-100 border-0 px-3 py-2" placeholder=""></textarea>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" accept=".mtlx,.mxsl,.xml,.txt" style="display:none;">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/lib/codemirror.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/xml/xml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/mode/clike/clike.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.18/addon/selection/active-line.min.js"></script>

    <!-- Load app.js -->
    <script src="static/app.js"></script>

</body>
</html>
